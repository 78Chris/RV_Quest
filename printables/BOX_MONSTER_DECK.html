<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Monster Deck Box Net</title>
<style>
  body{margin:0;padding:20px;background:#f0f0f0;font-family:sans-serif;}
  .wrapper{max-width:900px;margin:auto;background:white;padding:20px;border:1px solid #ccc;}
  h1{text-align:center;}
  .note{font-size:0.9em;color:#555;margin-bottom:10px;}
  svg{width:100%;height:auto;border:1px solid #999;}
</style>

<body>
<div class="wrapper">
<h1>Monster Deck – Printable Net</h1>
<p class="note">Cut along the <strong>red dashed</strong> lines, fold on the black borders, glue the two side flaps together, and close the box with the top and bottom grey strips.</p>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 242.6 140" width="800" height="460">
  <!-- Card size 70×120 mm, thickness ≈7.4 mm, flap =10 mm -->
  <g>
    <rect x="10" y="0" width="7.4" height="120" fill="#c0c0c0" stroke="black"/>
    <image x="17.4" y="0" width="70" height="120" href="./art_assets/MasterArtwork/Cards/Card%20Backs/vintage_medieval_woodcut_etching_of_a_monstrous_grimoire_cove_3d567044-557c-4aad-aa98-7cdc5a5ff889_2.png"/>
    <rect x="87.4" y="0" width="7.4" height="120" fill="#c0c0c0" stroke="black"/>
    <image x="94.8" y="0" width="70" height="120" href="./art_assets/MasterArtwork/Cards/Card%20Backs/vintage_medieval_woodcut_etching_of_a_monstrous_grimoire_cove_3d567044-557c-4aad-aa98-7cdc5a5ff889_2.png"/>
    <!-- side flaps -->
    <rect x="0" y="0" width="10" height="120" fill="#e0e0e0" stroke="black"/>
    <rect x="164.8" y="0" width="10" height="120" fill="#e0e0e0" stroke="black"/>
    <!-- top/bottom closing strips -->
    <rect x="-10" y="-10" width="242.6" height="10" fill="#e0e0e0" stroke="black"/>
    <rect x="-10" y="120" width="242.6" height="10" fill="#e0e0e0" stroke="black"/>
  </g>
  <g stroke="red" stroke-dasharray="1 1" fill="none">
    <rect x="10" y="0" width="7.4" height="120"/>
    <rect x="17.4" y="0" width="70" height="120"/>
    <rect x="87.4" y="0" width="7.4" height="120"/>
    <rect x="94.8" y="0" width="70" height="120"/>
    <rect x="0" y="0" width="10" height="120"/>
    <rect x="164.8" y="0" width="10" height="120"/>
    <rect x="-10" y="-10" width="242.6" height="10"/>
    <rect x="-10" y="120" width="242.6" height="10"/>
  </g>
</svg>
</div>
