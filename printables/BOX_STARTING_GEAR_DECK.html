<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Starting Gear & Spells Deck Box Net</title>
<style>
  body{margin:0;padding:20px;background:#f0f0f0;font-family:sans-serif;}
  .wrapper{max-width:900px;margin:auto;background:white;padding:20px;border:1px solid #ccc;}
  h1{text-align:center;}
  .note{font-size:0.9em;color:#555;margin-bottom:10px;}
  svg{width:100%;height:auto;border:1px solid #999;}
</style>
</head>
<body>
<div class="wrapper">
<h1>Starting Gear & Spells Deck – Printable Net</h1>
<p class="note">Cut on the <strong>red dashed</strong> lines, fold on the black borders, glue the two side flaps together, and close with the top and bottom grey strips.</p>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 242.6 140" width="800" height="460">
  <!-- Card size 70×120 mm, thickness ≈10.55 mm, flap =10 mm -->
  <g>
    <rect x="10" y="0" width="10.55" height="120" fill="#c0c0c0" stroke="black"/>
    <image x="20.55" y="0" width="70" height="120" href="./art_assets/MasterArtwork/Cards/Card%20Backs/vintage_medieval_woodcut_etching_of_an_ancient_imperial_wizar_bd9e6812-0ff4-4a7c-abda-11b26cc5672c_3.png"/>
    <rect x="90.55" y="0" width="10.55" height="120" fill="#c0c0c0" stroke="black"/>
    <image x="101.1" y="0" width="70" height="120" href="./art_assets/MasterArtwork/Cards/Card%20Backs/vintage_medieval_woodcut_etching_of_an_ancient_imperial_wizar_bd9e6812-0ff4-4a7c-abda-11b26cc5672c_3.png"/>
    <!-- side flaps -->
    <rect x="0" y="0" width="10" height="120" fill="#e0e0e0" stroke="black"/>
    <rect x="171.1" y="0" width="10" height="120" fill="#e0e0e0" stroke="black"/>
    <!-- top/bottom closing strips -->
    <rect x="-10" y="-10" width="242.6" height="10" fill="#e0e0e0" stroke="black"/>
    <rect x="-10" y="120" width="242.6" height="10" fill="#e0e0e0" stroke="black"/>
  </g>
  <g stroke="red" stroke-dasharray="1 1" fill="none">
    <rect x="10" y="0" width="10.55" height="120"/>
    <rect x="20.55" y="0" width="70" height="120"/>
    <rect x="90.55" y="0" width="10.55" height="120"/>
    <rect x="101.1" y="0" width="70" height="120"/>
    <rect x="0" y="0" width="10" height="120"/>
    <rect x="171.1" y="0" width="10" height="120"/>
    <rect x="-10" y="-10" width="242.6" height="10"/>
    <rect x="-10" y="120" width="242.6" height="10"/>
  </g>
</svg>
</div>
</body>
</html>
