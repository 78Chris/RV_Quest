<!DOCTYPE html>

<head>

<title>Encounter Deck Box Net</title>
<style>
  body{margin:0;padding:20px;background:#f0f0f0;font-family:sans-serif;}
  .wrapper{max-width:900px;margin:auto;background:white;padding:20px;border:1px solid #ccc;}
  h1{text-align:center;}
  .note{font-size:0.9em;color:#555;margin-bottom:10px;}
  svg{width:100%;height:auto;border:1px solid #999;}

<body>
<div class="wrapper">
<h1>Begegnungsdeck (Die Tiefen Gewölbe) – Printable Net</h1>
<p class="note">Ausschneiden entlang der <strong>roten gestrichelten</strong> Linien, an den durchgezogenen schwarzen Linien falzen und kleben.</p>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 242 140" width="800" height="460">
  <!-- Card size 70×120 mm, thickness ≈9.2 mm (16 cards), flap =10 mm -->
  <g>
    <rect x="10" y="0" width="9.2" height="120" fill="#a8b8a0" stroke="black"/>
    <image x="19.2" y="0" width="70" height="120" href="./art_assets/MasterArtwork/Cards/Card%20Backs/vintage_medieval_woodcut_etching_of_a_dark_dungeon_doorway_en_67ef1647-9bfe-4d93-95eb-efadf7cba3a4_1.png"/>
    <rect x="89.2" y="0" width="9.2" height="120" fill="#a8b8a0" stroke="black"/>
    <image x="98.4" y="0" width="70" height="120" href="./art_assets/MasterArtwork/Cards/Card%20Backs/vintage_medieval_woodcut_etching_of_a_dark_dungeon_doorway_en_67ef1647-9bfe-4d93-95eb-efadf7cba3a4_1.png"/>
    <!-- side flaps -->
    <rect x="0" y="0" width="10" height="120" fill="#e8e8e8" stroke="black"/>
    <rect x="168.4" y="0" width="10" height="120" fill="#e8e8e8" stroke="black"/>
    <!-- top/bottom closing strips -->
    <rect x="-10" y="-10" width="242" height="10" fill="#e8e8e8" stroke="black"/>
    <rect x="-10" y="120" width="242" height="10" fill="#e8e8e8" stroke="black"/>
  </g>
  <g stroke="red" stroke-dasharray="1 1" fill="none">
    <rect x="10" y="0" width="9.2" height="120"/>
    <rect x="19.2" y="0" width="70" height="120"/>
    <rect x="89.2" y="0" width="9.2" height="120"/>
    <rect x="98.4" y="0" width="70" height="120"/>
    <rect x="0" y="0" width="10" height="120"/>
    <rect x="168.4" y="0" width="10" height="120"/>
    <rect x="-10" y="-10" width="242" height="10"/>
    <rect x="-10" y="120" width="242" height="10"/>
  </g>
</svg>
</div>
