<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 793.7 1122.5" width="210mm" height="297mm">
  <defs>
    <!-- Dark fantasy parchment gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="100%" stop-color="#120e0b"/>
    </radialGradient>
    
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1c"/>
    </linearGradient>

    <!-- Steel Blade Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8e2dc"/>
      <stop offset="45%" stop-color="#f8f9fa"/>
      <stop offset="50%" stop-color="#8a9a9b"/>
      <stop offset="100%" stop-color="#4a5556"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Card Back Gradients -->
    <radialGradient id="backGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2a1f18"/>
      <stop offset="60%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#090705"/>
    </radialGradient>

    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a9899"/>
      <stop offset="50%" stop-color="#4e5859"/>
      <stop offset="100%" stop-color="#282f30"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <pattern id="chainPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0,10 L 10,0 L 20,10 L 10,20 Z" fill="none" stroke="#221812" stroke-width="0.8"/>
    </pattern>

    <!-- ======================================================== -->
    <!-- REUSABLE CARD FRONT: BARBARENAXT                         -->
    <!-- Width: 350, Height: 540                                  -->
    <!-- ======================================================== -->
    <g id="cardFront">
      <!-- CARD BASE -->
      <rect x="5" y="5" width="340" height="530" rx="14" fill="url(#bgGlow)" stroke="#3d3126" stroke-width="3"/>
      <rect x="14" y="14" width="322" height="512" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
      <rect x="18" y="18" width="314" height="504" rx="8" fill="none" stroke="#5a4632" stroke-width="0.8"/>

      <!-- CORNER ORNAMENTS -->
      <g fill="url(#goldGrad)">
        <polygon points="18,28 28,18 24,18 18,24"/>
        <polygon points="332,28 322,18 326,18 332,24"/>
        <polygon points="18,512 28,522 24,522 18,516"/>
        <polygon points="332,512 322,522 326,522 332,516"/>
      </g>

      <!-- HEADER: TITLE & TYPE -->
      <text x="175" y="46" font-family="'Cinzel', 'Palatino', 'Georgia', serif" font-size="16" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">
        NORDISCHE BARBARENAXT
      </text>
      <text x="175" y="66" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#a89a85" text-anchor="middle">
        ◈ Startwaffe · 2 Hände
      </text>

      <!-- ARTWORK FRAME -->
      <rect x="35" y="82" width="280" height="210" rx="6" fill="#18130f" stroke="#4a3b2c" stroke-width="1.5"/>
      <circle cx="175" cy="187" r="90" fill="#221b14" stroke="#36291c" stroke-width="1"/>

      <!-- VECTOR ART: NORDIC BATTLE AXE -->
      <g filter="url(#shadow)" transform="translate(175, 187) rotate(-28)">
        <path d="M -7, -100 L 7, -100 L 5, 115 C 5, 122 -5, 122 -5, 115 Z" fill="#6a4427" stroke="#382110" stroke-width="1.5"/>
        <path d="M -6, 20 L 6, 32 M -6, 40 L 6, 52 M -6, 60 L 6, 72 M -6, 80 L 6, 92" stroke="#412713" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 6, 20 L -6, 32 M 6, 40 L -6, 52 M 6, 60 L -6, 72 M 6, 80 L -6, 92" stroke="#2c1a0c" stroke-width="2" stroke-linecap="round"/>
        <path d="M -7, 112 L 7, 112 L 5, 122 C 3, 126 -3, 126 -5, 122 Z" fill="#4a5556" stroke="#252b2c" stroke-width="1"/>
        <polygon points="0,-115 -4,-100 4,-100" fill="#718284" stroke="#252b2c" stroke-width="1"/>
        <rect x="-9" y="-85" width="18" height="28" rx="2" fill="#3f4a4b" stroke="#1f2526" stroke-width="1.2"/>
        <circle cx="0" cy="-71" r="2.5" fill="#a6b4b5"/>
        <path d="M -8, -84 C -35, -84 -75, -75 -95, -55 C -90, -15 -85, 20 -40, 5 C -20, -3 -10, -56 -8, -60 Z" fill="url(#steelGrad)" stroke="#1a2021" stroke-width="1.5"/>
        <path d="M -12, -78 C -35, -78 -65, -68 -82, -50 C -78, -12 -70, 10 -42, 0" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
        <path d="M -30,-62 L -45,-55 L -35,-42 L -50,-35 M -40,-58 L -38,-38" stroke="#1e2526" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M 8, -80 L 35, -76 L 38, -65 L 8, -62 Z" fill="#586668" stroke="#1a2021" stroke-width="1.2"/>
      </g>

      <!-- STATS BADGE -->
      <g transform="translate(175, 315)">
        <path d="M -60,-16 L 60,-16 L 50,16 L 0,24 L -50,16 Z" fill="#7d1d1d" stroke="url(#goldGrad)" stroke-width="1.5"/>
        <text x="0" y="7" font-family="'Cinzel', 'Palatino', serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
          SCHADEN: 3
        </text>
      </g>

      <!-- RULES TEXT -->
      <rect x="28" y="350" width="294" height="135" rx="6" fill="#16120e" stroke="#3d3023" stroke-width="1"/>
      <text x="175" y="380" font-family="'Georgia', serif" font-size="13" font-weight="bold" fill="#f0e6d2" text-anchor="middle">
        Wuchtiger Schwung
      </text>
      <text x="175" y="405" font-family="'Georgia', serif" font-size="12" fill="#d2c4b0" text-anchor="middle">
        Erfordert mindestens <tspan font-weight="bold" fill="#e5a93c">KRA 2</tspan>.
      </text>
      <text x="175" y="430" font-family="'Georgia', serif" font-size="11.5" fill="#a89a85" text-anchor="middle">
        Trifft der Angriff mit einer gewürfelten
      </text>
      <text x="175" y="448" font-family="'Georgia', serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        »6« (Volltreffer),
      </text>
      <text x="175" y="468" font-family="'Georgia', serif" font-size="11.5" fill="#d2c4b0" text-anchor="middle">
        wird das Ziel 1 Feld zurückgestoßen.
      </text>

      <!-- FOOTER -->
      <text x="36" y="504" font-family="'Georgia', serif" font-size="10" fill="#756755">
        ◈ STARTGEGENSTAND
      </text>
      <text x="314" y="504" font-family="'Georgia', serif" font-size="10" fill="#756755" text-anchor="end">
        #01 / BERSERKER
      </text>
    </g>

    <!-- ======================================================== -->
    <!-- REUSABLE CARD BACK: AUSRÜSTUNG                           -->
    <!-- Width: 350, Height: 540                                  -->
    <!-- ======================================================== -->
    <g id="cardBack">
      <rect x="0" y="0" width="350" height="540" rx="14" fill="url(#backGlow)"/>
      <rect x="10" y="10" width="330" height="520" rx="10" fill="url(#chainPattern)" opacity="0.6"/>
      <rect x="18" y="18" width="314" height="504" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
      <rect x="24" y="24" width="302" height="492" rx="6" fill="none" stroke="#3d2c1e" stroke-width="1"/>

      <!-- CORNER ORNAMENTS -->
      <g fill="url(#goldGrad)" opacity="0.9">
        <polygon points="24,40 40,24 35,24 24,35"/>
        <circle cx="44" cy="44" r="3"/>
        <path d="M 24,48 L 48,24" stroke="url(#goldGrad)" stroke-width="1.5"/>
        <polygon points="326,40 310,24 315,24 326,35"/>
        <circle cx="306" cy="44" r="3"/>
        <path d="M 326,48 L 302,24" stroke="url(#goldGrad)" stroke-width="1.5"/>
        <polygon points="24,500 40,516 35,516 24,505"/>
        <circle cx="44" cy="496" r="3"/>
        <path d="M 24,492 L 48,516" stroke="url(#goldGrad)" stroke-width="1.5"/>
        <polygon points="326,500 310,516 315,516 326,505"/>
        <circle cx="306" cy="496" r="3"/>
        <path d="M 326,492 L 302,516" stroke="url(#goldGrad)" stroke-width="1.5"/>
      </g>

      <!-- CENTRAL MEDALLION -->
      <g filter="url(#cardShadow)">
        <circle cx="175" cy="270" r="115" fill="#18110c" stroke="url(#goldGrad)" stroke-width="3"/>
        <circle cx="175" cy="270" r="105" fill="#201711" stroke="#3d2c1e" stroke-width="1.5"/>
        <circle cx="175" cy="270" r="96" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="6,4"/>

        <!-- Crossed Swords -->
        <g transform="translate(175, 270) rotate(45)">
          <polygon points="-5,-95 5,-95 4,75 -4,75" fill="url(#ironGrad)" stroke="#1a2021" stroke-width="1"/>
          <line x1="0" y1="-85" x2="0" y2="60" stroke="#121617" stroke-width="1.5"/>
          <rect x="-24" y="70" width="48" height="8" rx="2" fill="url(#goldGrad)" stroke="#3a280c" stroke-width="1"/>
          <rect x="-3" y="78" width="6" height="24" fill="#382110"/>
          <circle cx="0" cy="106" r="6" fill="url(#goldGrad)" stroke="#3a280c" stroke-width="1"/>
        </g>
        <g transform="translate(175, 270) rotate(-45)">
          <polygon points="-5,-95 5,-95 4,75 -4,75" fill="url(#ironGrad)" stroke="#1a2021" stroke-width="1"/>
          <line x1="0" y1="-85" x2="0" y2="60" stroke="#121617" stroke-width="1.5"/>
          <rect x="-24" y="70" width="48" height="8" rx="2" fill="url(#goldGrad)" stroke="#3a280c" stroke-width="1"/>
          <rect x="-3" y="78" width="6" height="24" fill="#382110"/>
          <circle cx="0" cy="106" r="6" fill="url(#goldGrad)" stroke="#3a280c" stroke-width="1"/>
        </g>

        <!-- Crest -->
        <g transform="translate(175, 270)">
          <polygon points="0,-48 38,-18 28,32 0,54 -28,32 -38,-18" fill="#681515" stroke="url(#goldGrad)" stroke-width="2.5"/>
          <polygon points="0,-40 30,-16 22,25 0,44 -22,25 -30,-16" fill="none" stroke="#a33232" stroke-width="1.2"/>
          <path d="M -12,-18 C -5,-28 10,-28 16,-14 C 20,-2 10,12 0,22 C -10,12 -20,-2 -16,-14 Z" fill="url(#goldGrad)" stroke="#422f0c" stroke-width="1"/>
          <circle cx="0" cy="-2" r="3" fill="#140f0c"/>
        </g>
      </g>

      <!-- TEXT BANNERS -->
      <text x="175" y="102" font-family="'Cinzel', 'Palatino', 'Georgia', serif" font-size="13" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
        AUSRÜSTUNG
      </text>
      <line x1="90" y1="112" x2="260" y2="112" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="25,5,5,5,25"/>

      <line x1="90" y1="428" x2="260" y2="428" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="25,5,5,5,25"/>
      <text x="175" y="448" font-family="'Cinzel', 'Palatino', 'Georgia', serif" font-size="13" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
        AUSRÜSTUNG
      </text>
      <text x="175" y="490" font-family="'Georgia', serif" font-size="9" fill="#75614f" text-anchor="middle" letter-spacing="1">
        DIE ALTE WELT
      </text>
    </g>
  </defs>

  <!-- ============================================================ -->
  <!-- A4 PRINT SHEET (210 x 297 mm, viewBox 793.7 x 1122.5 px)     -->
  <!-- ============================================================ -->

  <!-- Printable Page Background (Clean White) -->
  <rect x="0" y="0" width="793.7" height="1122.5" fill="#fdfdfc"/>

  <!-- SHEET HEADER & PRINT INSTRUCTIONS -->
  <g id="sheetHeader" transform="translate(396.85, 60)" text-anchor="middle">
    <text font-family="'Cinzel', 'Palatino', 'Georgia', serif" font-size="20" font-weight="bold" fill="#241b14" letter-spacing="1.5">
      VON HELDEN UND MONSTERN — SPIELKARTEN-DRUCKBOGEN
    </text>
    <text y="24" font-family="'Georgia', serif" font-size="12" fill="#5c4d3e">
      A4 Druckbogen (Gutter-Fold Klapp-Methode) · Mini-Euro Kartenformat (44 × 68 mm)
    </text>
    <text y="42" font-family="'Georgia', serif" font-size="10.5" fill="#7c6e60">
      ✂ Anleitung: Entlang der roten gestrichelten Mittellinie rillen &amp; falzen, beidseitig verkleben, dann entlang der Schnittmarken ausschneiden.
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- CARDS LAYOUT: SIDE-BY-SIDE (FRONT ON LEFT, BACK ON RIGHT)    -->
  <!-- Card size in print scale (factor 0.4746): 166.1 x 256.3 px    -->
  <!-- ============================================================ -->

  <!-- CENTRAL FOLD LINE (Dash array, Red/Brown) -->
  <line x1="396.85" y1="130" x2="396.85" y2="1000" stroke="#b23b3b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="396.85" y="125" font-family="'Georgia', serif" font-size="9" font-weight="bold" fill="#b23b3b" text-anchor="middle" letter-spacing="1">
    ▼ FALZ- &amp; KLAPPLINIE (GUTTER FOLD) ▼
  </text>
  <text x="396.85" y="1015" font-family="'Georgia', serif" font-size="9" font-weight="bold" fill="#b23b3b" text-anchor="middle" letter-spacing="1">
    ▲ FALZ- &amp; KLAPPLINIE (GUTTER FOLD) ▲
  </text>

  <!-- ------------------------------------------------------------ -->
  <!-- ROW 1 (Y: 150)                                               -->
  <!-- ------------------------------------------------------------ -->
  <!-- Left: Card Front (Nordische Barbarenaxt) -->
  <g transform="translate(210.75, 150) scale(0.4746)">
    <use href="#cardFront"/>
  </g>

  <!-- Right: Card Back (Ausrüstungsdeck) -->
  <g transform="translate(416.85, 150) scale(0.4746)">
    <use href="#cardBack"/>
  </g>

  <!-- ------------------------------------------------------------ -->
  <!-- ROW 2 (Y: 430)                                               -->
  <!-- ------------------------------------------------------------ -->
  <!-- Left: Card Front (Nordische Barbarenaxt - Kopie / Zweitexemplar) -->
  <g transform="translate(210.75, 430) scale(0.4746)">
    <use href="#cardFront"/>
  </g>

  <!-- Right: Card Back (Ausrüstungsdeck) -->
  <g transform="translate(416.85, 430) scale(0.4746)">
    <use href="#cardBack"/>
  </g>

  <!-- ------------------------------------------------------------ -->
  <!-- ROW 3 (Y: 710)                                               -->
  <!-- ------------------------------------------------------------ -->
  <!-- Left: Card Front (Nordische Barbarenaxt - Kopie / Testexemplar) -->
  <g transform="translate(210.75, 710) scale(0.4746)">
    <use href="#cardFront"/>
  </g>

  <!-- Right: Card Back (Ausrüstungsdeck) -->
  <g transform="translate(416.85, 710) scale(0.4746)">
    <use href="#cardBack"/>
  </g>

  <!-- ============================================================ -->
  <!-- CROP MARKS / SCHNITTMARKEN                                   -->
  <!-- ============================================================ -->
  <!-- Horizontal cuts -->
  <!-- Row 1 Top -->
  <line x1="180" y1="150" x2="200" y2="150" stroke="#000000" stroke-width="0.8"/>
  <line x1="593" y1="150" x2="613" y2="150" stroke="#000000" stroke-width="0.8"/>
  <!-- Row 1 Bottom -->
  <line x1="180" y1="406.3" x2="200" y2="406.3" stroke="#000000" stroke-width="0.8"/>
  <line x1="593" y1="406.3" x2="613" y2="406.3" stroke="#000000" stroke-width="0.8"/>

  <!-- Row 2 Top -->
  <line x1="180" y1="430" x2="200" y2="430" stroke="#000000" stroke-width="0.8"/>
  <line x1="593" y1="430" x2="613" y2="430" stroke="#000000" stroke-width="0.8"/>
  <!-- Row 2 Bottom -->
  <line x1="180" y1="686.3" x2="200" y2="686.3" stroke="#000000" stroke-width="0.8"/>
  <line x1="593" y1="686.3" x2="613" y2="686.3" stroke="#000000" stroke-width="0.8"/>

  <!-- Row 3 Top -->
  <line x1="180" y1="710" x2="200" y2="710" stroke="#000000" stroke-width="0.8"/>
  <line x1="593" y1="710" x2="613" y2="710" stroke="#000000" stroke-width="0.8"/>
  <!-- Row 3 Bottom -->
  <line x1="180" y1="966.3" x2="200" y2="966.3" stroke="#000000" stroke-width="0.8"/>
  <line x1="593" y1="966.3" x2="613" y2="966.3" stroke="#000000" stroke-width="0.8"/>

  <!-- Vertical cuts (Left outer, and Right outer) -->
  <line x1="210.75" y1="125" x2="210.75" y2="140" stroke="#000000" stroke-width="0.8"/>
  <line x1="210.75" y1="975" x2="210.75" y2="990" stroke="#000000" stroke-width="0.8"/>

  <line x1="376.85" y1="125" x2="376.85" y2="140" stroke="#000000" stroke-width="0.8"/>
  <line x1="376.85" y1="975" x2="376.85" y2="990" stroke="#000000" stroke-width="0.8"/>

  <line x1="416.85" y1="125" x2="416.85" y2="140" stroke="#000000" stroke-width="0.8"/>
  <line x1="416.85" y1="975" x2="416.85" y2="990" stroke="#000000" stroke-width="0.8"/>

  <line x1="582.95" y1="125" x2="582.95" y2="140" stroke="#000000" stroke-width="0.8"/>
  <line x1="582.95" y1="975" x2="582.95" y2="990" stroke="#000000" stroke-width="0.8"/>

  <!-- FOOTER & DIMENSION CONFIRMATION -->
  <g transform="translate(396.85, 1070)" text-anchor="middle" font-family="'Georgia', serif" font-size="10" fill="#75614f">
    <text>
      Exakte Kartengröße nach Schnitt: 44,0 × 68,0 mm (Mini-Euro Standard) · 100% maßstabsgetreu (Druck ohne Skalierung / "Tatsächliche Größe")
    </text>
    <text y="16" font-size="9" fill="#9c8a77">
      Von Helden und Monstern — Abenteuer in der Alten Welt © 2026
    </text>
  </g>
</svg>
